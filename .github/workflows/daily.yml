name: Daily Medium Briefing

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install feedparser anthropic piper-tts

      - name: Build briefing script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python briefing.py

      - name: Convert to audio
        run: |
          python -m piper.download_voices en_US-lessac-medium
          python -m piper -m en_US-lessac-medium -f briefing.wav < briefing.txt

      - name: Save audio
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: |
            briefing.wav
            briefing.txt
            links.txt

      - name: Build page
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python make_page.py
          ffmpeg -y -i briefing.wav -b:a 64k site/briefing.mp3

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
